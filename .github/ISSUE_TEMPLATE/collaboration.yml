name: Join the project
description: Offer help or propose a bounded contribution to OSRI-0001.
title: "Collaboration: "
body:
  - type: markdown
    attributes:
      value: "Start with the [collaborator guide](https://github.com/Open-Source-Research-Initiative/medical-xr-from-capabilities-to-sustainable-use/blob/main/docs/join-the-project.md) and [screening tracker #9](https://github.com/Open-Source-Research-Initiative/medical-xr-from-capabilities-to-sustainable-use/issues/9). Claim a bounded screening or audit task in its existing issue to avoid duplicates. Required PI review follows completed model work and the final packet. Public reading and forking require no invitation. Avoid personal contact details and credentials."
  - type: textarea
    id: interests
    attributes:
      label: Interests and relevant experience
      description: Describe the part of the project you would like to help with.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Proposed task and availability
      description: Link an existing work-package issue and exact batch/IDs, or suggest a documentation, tooling, methods or source-provenance task. Coordinate the claim before beginning overlapping work.
    validations:
      required: true
  - type: textarea
    id: exposure
    attributes:
      label: Prior exposure and assistance
      description: For source-review work, disclose AI decisions or archive material already viewed, and any agent assistance you expect to use.
