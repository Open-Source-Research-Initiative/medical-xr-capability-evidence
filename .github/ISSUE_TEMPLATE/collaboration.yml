name: Join the project
description: Offer help or propose a bounded contribution to OSRI-0001.
title: "Collaboration: "
body:
  - type: markdown
    attributes:
      value: "Start with the [collaborator guide](https://github.com/Open-Source-Research-Initiative/medical-xr-from-capabilities-to-sustainable-use/blob/main/docs/join-the-project.md). Documentation, tooling and methods feedback are welcome; scientific screening is paused. Public reading and forking require no invitation. Avoid personal contact details and credentials."
  - type: textarea
    id: interests
    attributes:
      label: Interests and relevant experience
      description: Describe the part of the project you would like to help with.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Proposed task and availability
      description: Suggest a bounded task or ask Cole to help identify one. Scientific screening is paused.
    validations:
      required: true
  - type: textarea
    id: exposure
    attributes:
      label: Prior exposure and assistance
      description: For source-review work, disclose AI decisions or archive material already viewed, and any agent assistance you expect to use.
